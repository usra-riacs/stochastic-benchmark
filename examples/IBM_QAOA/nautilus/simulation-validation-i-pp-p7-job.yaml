apiVersion: batch/v1
kind: Job
metadata:
  name: ibm-qaoa-i-pp-p7
  namespace: usra-expedition
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: runner
          image: python:3.11-bookworm
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends git build-essential
              rm -rf /var/lib/apt/lists/*

              if [[ -n "${GITHUB_TOKEN:-}" ]]; then
                git config --global credential.helper "store --file=/tmp/git-credentials"
                printf 'https://x-access-token:%s@github.com\n' "${GITHUB_TOKEN}" > /tmp/git-credentials
                chmod 0600 /tmp/git-credentials
              fi

              mkdir -p /workspace/repos
              cd /workspace/repos
              if [[ -d stochastic-benchmark/.git ]]; then
                git -C stochastic-benchmark fetch origin "${STOCHASTIC_BENCHMARK_BRANCH}"
                git -C stochastic-benchmark checkout "${STOCHASTIC_BENCHMARK_BRANCH}"
                git -C stochastic-benchmark pull --ff-only origin "${STOCHASTIC_BENCHMARK_BRANCH}"
              else
                git clone --branch "${STOCHASTIC_BENCHMARK_BRANCH}" --depth 1 "${STOCHASTIC_BENCHMARK_REPO}" stochastic-benchmark
              fi

              bash stochastic-benchmark/examples/IBM_QAOA/nautilus/run_simulation_validation.sh \
                --output-root /workspace/results/pss_window_sticker/heavy_hex_144_I_p7_expanded \
                --reuse-output-root /workspace/results/pss_window_sticker/heavy_hex_144 \
                --reuse-output-root /workspace/results/pss_window_sticker/heavy_hex_144_small \
                --graph-type heavy_hex \
                --num-nodes 144 \
                --p-values 7 \
                --train-count 20 \
                --test-count 10 \
                --start-train-index 100 \
                --fa-method-name I_PP \
                --pt-method-name "" \
                --fa-n-values 10,20,40,60,80,100,150 \
                --fa-m-values 10,25,50,100,200,500,1000 \
                --q-values 100,250,500,1000,2500,5000,10000 \
                --t-grid-points 1000 \
                --t-grid-scale log \
                --mps-chi 20 \
                --max-parallel-threads 32
          env:
            - name: WORKDIR
              value: /workspace
            - name: STOCHASTIC_BENCHMARK_REPO
              value: https://github.com/usra-riacs/stochastic-benchmark.git
            - name: STOCHASTIC_BENCHMARK_BRANCH
              value: QAOA_Parameter_Setting_IBM
            - name: QPS_REPO_URL
              value: https://github.com/Quantum-Working-Groups/QAOA-Parameter-Setting.git
            - name: QPS_BRANCH
              value: main
            - name: QAOA_PIPELINE_REPO_URL
              value: https://github.com/qiskit-community/qaoa_training_pipeline.git
            - name: QAOA_PIPELINE_BRANCH
              value: main
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: token
                  optional: true
          resources:
            requests:
              cpu: "32"
              memory: 128Gi
            limits:
              cpu: "64"
              memory: 256Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: ibm-qaoa-workspace
