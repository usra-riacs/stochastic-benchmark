apiVersion: batch/v1
kind: Job
metadata:
  name: ibm-qaoa-fa-opt-p5-shards
  namespace: usra-expedition
spec:
  completions: 10
  parallelism: 10
  completionMode: Indexed
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: runner
          image: python:3.11-bookworm
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends git build-essential
              rm -rf /var/lib/apt/lists/*

              export WORKDIR="/workspace/workdirs/shard-${JOB_COMPLETION_INDEX}"
              mkdir -p "${WORKDIR}" /workspace/results /workspace/data

              if [[ -n "${GITHUB_TOKEN:-}" ]]; then
                git config --global credential.helper "store --file=/tmp/git-credentials"
                printf 'https://x-access-token:%s@github.com\n' "${GITHUB_TOKEN}" > /tmp/git-credentials
                chmod 0600 /tmp/git-credentials
              fi

              mkdir -p "${WORKDIR}/repos"
              if [[ -d "${WORKDIR}/repos/stochastic-benchmark/.git" ]]; then
                git -C "${WORKDIR}/repos/stochastic-benchmark" fetch origin "${STOCHASTIC_BENCHMARK_BRANCH}"
                git -C "${WORKDIR}/repos/stochastic-benchmark" checkout "${STOCHASTIC_BENCHMARK_BRANCH}"
                git -C "${WORKDIR}/repos/stochastic-benchmark" pull --ff-only origin "${STOCHASTIC_BENCHMARK_BRANCH}"
              else
                git clone --branch "${STOCHASTIC_BENCHMARK_BRANCH}" --depth 1 "${STOCHASTIC_BENCHMARK_REPO}" "${WORKDIR}/repos/stochastic-benchmark"
              fi

              bash "${WORKDIR}/repos/stochastic-benchmark/examples/IBM_QAOA/nautilus/run_simulation_validation.sh" \
                --output-root /workspace/results/pss_window_sticker/heavy_hex_144_FA_opt_p5_expanded \
                --reuse-output-root /workspace/results/pss_window_sticker/heavy_hex_144_FA_PP_opt_p5_expanded \
                --reuse-output-root /workspace/results/pss_window_sticker/heavy_hex_144_FA_opt_p5_expanded \
                --instance-cache-root /workspace/data/generated_instances \
                --shards-root /workspace/results/pss_window_sticker/heavy_hex_144_FA_opt_p5_expanded/shards \
                --exact-only \
                --restart \
                --shard-count 10 \
                --shard-index "${JOB_COMPLETION_INDEX}" \
                --graph-type heavy_hex \
                --num-nodes 144 \
                --p-values 5 \
                --train-count 20 \
                --test-count 10 \
                --start-train-index 100 \
                --fa-method-name FA_PP_opt \
                --pt-method-name "" \
                --fa-n-values 10,20,40,60,80,100,150 \
                --fa-m-values 10,25,50,100,200,500,1000 \
                --q-values 100,250,500,1000,2500,5000,10000 \
                --t-grid-points 1000 \
                --t-grid-scale log \
                --mps-chi 20 \
                --max-parallel-threads 8
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - name: STOCHASTIC_BENCHMARK_REPO
              value: https://github.com/usra-riacs/stochastic-benchmark.git
            - name: STOCHASTIC_BENCHMARK_BRANCH
              value: QAOA_Parameter_Setting_IBM
            - name: QPS_REPO_URL
              value: https://github.com/Quantum-Working-Groups/QAOA-Parameter-Setting.git
            - name: QPS_BRANCH
              value: main
            - name: QAOA_PIPELINE_REPO_URL
              value: https://github.com/qiskit-community/qaoa_training_pipeline.git
            - name: QAOA_PIPELINE_BRANCH
              value: main
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-credentials
                  key: token
                  optional: true
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
            limits:
              cpu: "8"
              memory: 32Gi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: ibm-qaoa-workspace
